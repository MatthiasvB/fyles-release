[package]
name = "fyles-core"
version = "0.7.0"
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
bs58 = { workspace = true }
# CRATE-HYGIENE EXCEPTION: only for core::p2p::peer_id_from_node_keypair, so the seed_sync_docs
# migration can derive this device's PeerId from the stored node keypair. See that function.
libp2p = { workspace = true, features = ["ed25519"] }
futures = { workspace = true }
itertools = { workspace = true }
prost = { workspace = true }
rusqlite = { workspace = true, features = ["bundled", "backup"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "rt", "rt-multi-thread", "fs", "time"] }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
semver = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
data-encoding = { workspace = true }
autosurgeon = { workspace = true }
automerge = { workspace = true }
expiringmap = { workspace = true }
serde_bytes = { workspace = true }
bincode = { workspace = true }
tracing = { workspace = true }
sanitize-filename = { workspace = true }
rand = { workspace = true }
zip_clone = { workspace = true }
crypto = { workspace = true }
license_format = { workspace = true }
tempfile = { workspace = true }
futures-util = { workspace = true }
subtle = { workspace = true, features = ["const-generics"] }
base64 = { workspace = true }
zstd = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
zeroize = { workspace = true }
zxcvbn_lite = { workspace = true }
libc.workspace = true
tokio-util = { workspace = true, features = ["compat", "rt", "time"] }
derive_more = { workspace = true, features = ["as_ref", "deref", "deref_mut", "display", "from", "from_str", "try_from"] }
axum = { workspace = true, optional = true, features = ["macros"] }
erased-serde = { workspace = true, optional = true }

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
crypto = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
otel-jaeger = []
console = []
dev-keys = ["license_format/dev-keys"]
test-support = ["crypto/test-support"]
debug-server = [ "axum", "erased-serde" ]
axum = ["dep:axum"]

