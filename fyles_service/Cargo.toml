[workspace]
members = ["core", "crypto", "daemon", "direct_host_utils", "license_format", "p2p", "zxcvbn_lite"]
resolver = "2"

[workspace.package]
rust-version = "1.91.0"
edition = "2024"
license = "UNLICENSED"

[profile.release]
# https://github.com/johnthagen/min-sized-rust
# Below optimizations reduce binary size from 10.17 MB to 3.74 MB on linux
strip = "symbols"  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size. "s" may also yield good results
lto = true # link time optimization
codegen-units = 1 # slower build but better optimization
panic = "abort" # no unwinding code. This may be a bit drastic

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release.package.argon2]
opt-level = 3

[profile.release.package.blake2]
opt-level = 3

# Rust nightly would allow recompiling libstd for size and also drop
# unused code, but I'm not going that far, yet

[patch.crates-io]
libp2p = { git = "ssh://git@github.com/MatthiasvB/rust-libp2p.git", branch = "master" }
libp2p-core = { git = "ssh://git@github.com/MatthiasvB/rust-libp2p.git", branch = "master" }
libp2p-swarm = { git = "ssh://git@github.com/MatthiasvB/rust-libp2p.git", branch = "master" }
libp2p-request-response = { git = "ssh://git@github.com/MatthiasvB/rust-libp2p.git", branch = "master" }
libp2p-yamux = { git = "ssh://git@github.com/MatthiasvB/rust-libp2p.git", branch = "master" }
libp2p-swarm-test = { git = "ssh://git@github.com/MatthiasvB/rust-libp2p.git", branch = "master" }

[workspace.dependencies]
rand = "0.10.1"
# ed25519-dalek/x25519-dalek and libp2p are still on rand_core 0.6; its OsRng
# satisfies their CryptoRng bounds (rand 0.10 dropped OsRng in favor of SysRng).
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = "1.52.3"
aes-gcm = "0.10.3"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
async-trait = "0.1.89"
asynchronous-codec = "0.7.0"
automerge = "0.10.0"
autosurgeon = "0.12.0"
bincode = { version = "2.0.1", features = ["serde"] }
bs58 = "0.5.1"
bytes = "1.11.1"
cbindgen = "0.29.4"
chacha20poly1305 = "0.10.1"
clap = "4.6.1"
crypto = { path = "crypto" }
direct_host_utils = { path = "direct_host_utils" }
license_format = { path = "license_format" }
zxcvbn_lite = { path = "zxcvbn_lite" }
axum = "0.8"
tower-http = "0.6"
hmac = "0.13"
hex = "0.4"
derive_more = "2.1.1"
ed25519-dalek = "2.2.0"
expiringmap = "0.1.2"
fluent = "0.17.0"
futures = "0.3.32"
hkdf = "0.13.0"
include-flate = "0.3.4"
itertools = "0.15.0"
jni = "0.22.4"
libc = "0.2.186"
libp2p = "0.57.0"
libp2p-stream = { git = "ssh://git@github.com/MatthiasvB/rust-libp2p.git", branch = "master" }
libp2p-swarm-test = "0.7.0"
log = "0.4.32"
notify-rust = "4.17.0"
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry-stdout = "0.32.0"
opentelemetry_sdk = "0.32.1"
p2p = { path = "p2p" }
prost = "0.14.4"
rusqlite = "0.43.0"
sanitize-filename = "0.6.0"
semver = "1.0.28"
serde = "1.0.228"
serde_bytes = "0.11.19"
serde_json = "1.0.150"
sha2 = "0.11.0"
sys-locale = "0.3.2"
tap = "1.0.1"
tempfile = "3.27.0"
test-log = { version = "0.2.21", default-features = false }
thiserror = "2.0.18"
tokio-stream = "0.1.18"
tonic = "0.14.5"
tonic-build = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
tracing = "0.1.44"
tracing-android = "0.2.0"
tracing-opentelemetry = "0.33.0"
tracing-oslog = "0.3.0"
