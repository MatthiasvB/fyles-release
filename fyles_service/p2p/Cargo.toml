[package]
name = "p2p"
version = "0.2.0"
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# nothing in the code _or the runtime_ will let you know that this is required, but without
# the "rsa" feature you will be unable to find nodes via the DHT (and possibly other problems!)
libp2p = { workspace = true, features = ["autonat", "cbor", "dcutr", "dns", "ed25519", "identify", "kad", "macros", "mdns", "noise", "quic", "relay", "request-response", "rsa", "tcp", "tokio", "yamux"] }
libp2p-stream = { workspace = true }
asynchronous-codec = { workspace = true }
bytes = { workspace = true }
serde_bytes = { workspace = true }
fyles-core = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
async-trait = { workspace = true }
tracing = { workspace = true }
rand.workspace = true
rand_core.workspace = true
crypto = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tap = { workspace = true }
zeroize = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
itertools = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
bs58.workspace = true
derive_more = { workspace = true, features = ["deref"] }
tokio-util = { workspace = true, features = ["rt", "time"] }
log = { workspace = true }
hashbrown = { workspace = true }
erased-serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }

[dev-dependencies]
test-log = { workspace = true, features = ["trace"] }
libp2p-swarm-test = { workspace = true, features = ["tokio"] }
tempfile = { workspace = true }
fyles-core = { workspace = true, features = ["test-support"] }
crypto = { workspace = true, features = ["test-support"] }
tokio-util = { workspace = true, features = ["compat"] }

[features]
test-support = []
debug-server = ["fyles-core/debug-server", "erased-serde", "serde_derive" ]
