syntax = "proto3";
package api;

import "filerequest_compat.proto";

// Add version messages before the FileRequestProto
message GetVersionRequest {}

message GetVersionResponse {
    string version = 1;
}

// Design Philosophy:
// - No implicitly optional parameters in request messages
// - Each endpoint should have exactly one clear purpose
// - Split endpoints instead of using optional parameters

message AccessProto {
  oneof access {
    PublicProto public = 1;
    SpecificUsersProto audience = 2;
  }
}

message FileRequestProto {
  string id = 1;
  string title = 2;
  string description = 3;
  AccessProto access = 4; // Changed from inline oneof to AccessProto
  bool is_active = 6;
}

message PublicProto {
  // This can be empty, but including it explicitly clarifies intent
}

message SpecificUsersProto {
  repeated string contact_ids = 1; // List of user IDs
}

message ContactProto {
  string id = 1;
  // Empty for the user's own contact until they name themselves, and never again after, since a
  // name is never set to empty. Not optional, because being unnamed only exists before setup and
  // every reader would otherwise carry that case for good.
  string name = 2;
}

message CreatePeerProto {
  string peer_id = 2;
  string name = 3;
}

message PeerProto {
  string id = 1;
  string peer_id = 2;
  string name = 3;
}

message RemoteFileRequestProto {
  string id = 1;
  string peer_id = 2;
  string file_request_id = 3;
  string name = 4;
  string contact_id = 6;
}

message CreateRemoteFileRequestProto {
  string peer_id = 1;
  string file_request_id = 2;
  string name = 3;
  string contact_id = 5; 
}

enum SendStatusProto {
  PENDING = 0;
  SENDING = 1;
  SUCCESS = 2;
  REJECTED = 3;
  FAILED = 4;
  PREPARED = 5;
  INTERRUPTED = 6;
  PENDING_SENT = 7;
}

enum ReceiveStatusProto {
  RECEIVE_STATUS_RECEIVING = 0;
  RECEIVE_STATUS_INTERRUPTED = 1;
  RECEIVE_STATUS_COMPLETED = 2;
  RECEIVE_STATUS_FAILED = 3;
}

message TransferDataProto {
  uint64 progress_bytes = 5;
  string transfer_id = 6;
  uint64 file_size_bytes = 7;
}

message PendingFileProto {
  string id = 1;
  string file_path = 2;
  string target_file_request_id = 3;
  SendStatusProto send_status = 4;
  optional TransferDataProto transfer_data = 5;
  optional string display_name = 6;
  repeated string interruption_reasons = 7;
}

message FileInfoProto {
  string path = 1;
  optional string display_name = 2;
}

message CreatePendingFilesProto {
  repeated FileInfoProto file_infos = 1;
  string target_file_request_id = 2;
  SendStatusProto send_status = 3;
}

// Add new messages for client operations
message StoreRemoteFileRequestRequest {
  CreateRemoteFileRequestProto remote_file_request = 1;
}

message UpdateRemoteFileRequestRequest {
  RemoteFileRequestProto remote_file_request = 1;
}

message StoreRemoteFileRequestResponse {
  string id = 1; // Return ID of the created remote file request instead of success boolean
}

message GetRemoteFileRequestRequest {
  string id = 1;
}

message GetRemoteFileRequestResponse {
  RemoteFileRequestProto remote_file_request = 1;
}

message ListRemoteFileRequestsRequest {
  string contact_id = 1; // Now required
}

message ListRemoteFileRequestsResponse {
  repeated RemoteFileRequestProto remote_file_requests = 1;
}

message GetAllRemoteFileRequestsRequest {
  // Empty message as no parameters needed
}

message GetAllRemoteFileRequestsResponse {
  repeated RemoteFileRequestProto remote_file_requests = 1;
}

message DeleteRemoteFileRequestRequest {
  string id = 1;
}

message DeleteRemoteFileRequestResponse {
  bool success = 1;
}

message StorePendingFileRequest {
 CreatePendingFilesProto pending_files = 1;
}

message StorePendingFileResponse {
 repeated string ids = 1;
}

message GetPendingFileRequest {
  string id = 1;
}

message GetPendingFileResponse {
  PendingFileProto pending_file = 1;
}

message ListPendingFilesRequest {
  string target_file_request_id = 1; // Required - list files for specific request
}

message ListPendingFilesResponse {
  repeated PendingFileProto pending_files = 1;
}

message GetAllPendingFilesRequest {
  // Empty message as no parameters needed
}

message GetAllPendingFilesResponse {
  repeated PendingFileProto pending_files = 1;
}

message DeletePendingFileRequest {
  string id = 1;
}

message DeletePendingFileResponse {
  bool success = 1;
}

message ShutdownRequest {
  // Empty message as no parameters needed
}

message ShutdownResponse {
  bool success = 1;
}

// Add new messages before service definition
message GetContactNameRequest {
  string id = 1;
}

message GetContactNameResponse {
  string name = 1;
}

message GetContactNamesRequest {
  repeated string ids = 1;
}

message GetContactNamesResponse {
  map<string, string> names = 1; // map of id -> name
}

// Add new messages before the service definition
message ListPeersRequest {
  string contact_id = 1;
}

message ListPeersResponse {
  repeated PeerProto peers = 1;
}

message GetPeerRequest {
  string peer_id = 1;
}

message GetPeerResponse {
  PeerProto peer = 1;
}

message SyncPeersRequest {
  string contact_id = 1;
  repeated PeerProto peers = 2;
}

message SyncPeersResponse {
  repeated PeerProto updated_peers = 1;
}

message DeletePeerRequest {
  string peer_id = 1;
}

message DeletePeerResponse {
  bool success = 1;
}

// Add new messages for node peer id
message GetNodePeerIdRequest {
  // Empty as we just want our own peer id
}

message GetNodePeerIdResponse {
  string peer_id = 1;
}

// New message for received-file info
message ReceivedFileProto {
  string id = 1;
  optional string contact_id = 2;
  string filerequest_id = 3;
  string file_name = 4;
  string file_path = 5;
  int64 size = 6;
  int64 received_at_ms = 7; // ms since Unix epoch
  // The name the file is actually stored under on disk (after sanitization/
  // deduplication). This is what the UI should display.
  string persisted_as_name = 8;
}

// Request to list received files for a remote request
message ListReceivedFilesRequest {
  string remote_file_request_id = 1;
}

// Response containing all received files
message ListReceivedFilesResponse {
  repeated ReceivedFileProto received_files = 1;
}

message DeleteReceivedFileRequest {
  string id = 1;
}

message DeleteReceivedFileResponse {
  bool success = 1;
}

// Resolve the on-disk directory of a (local) filerequest, relative to the host's
// drop directory (i.e. below the platform-specific "Received" folder). Returns
// the "<sanitized-filerequest-title>" folder name. The client combines this with
// the base directory it manages — and, for a single file, with that file's
// persisted_as_name basename — to open/reveal it per platform.
message ResolveFilerequestLocationRequest {
  string filerequest_id = 1;
}

message ResolveFilerequestLocationResponse {
  // The filerequest folder's location — genuinely either-or:
  oneof location {
    // Complete absolute filesystem path, when the daemon runs on a directly
    // accessible filesystem (desktop). The client opens it as-is.
    string absolute_path = 1;
    // Path relative to the host drop root, on hosts with scoped/opaque storage
    // (Android SAF, iOS sandbox); the client composes the full path itself.
    string relative_path = 2;
  }
}

message GetSelfContactRequest {
  // Empty as there is only one self contact
}

message UpdateSelfContactNameRequest {
  // Rejected as INVALID_ARGUMENT when empty or whitespace only.
  string name = 1;
}

message UpdateSelfContactNameResponse {
  bool success = 1;
}

message StoreSelfPeerRequest {
  CreatePeerProto peer = 1;
}

message StoreSelfPeerResponse {
  string id = 1;
}

message DeleteSelfPeerRequest {
  string peer_id = 1;
}

message DeleteSelfPeerResponse {
  bool success = 1;
}

message UpdateSelfPeerRequest {
  PeerProto peer = 1;
}

message UpdateSelfPeerResponse {
  bool success = 1;
}

// Add new messages for the WaitForReady endpoint
message WaitForReadyRequest {
  // Empty request
}

message WaitForReadyResponse {
  bool successfully_started = 1;
}

// Opaque settings command interface. The request/response bytes are a serialized
// internet_settings.SettingsRequest / SettingsResponse; core never interprets
// them, it only relays them to the network node.
message GetSettingsRequest {
  // empty
}

message SettingsRequestEnvelope {
  bytes request = 1;
}

message SettingsResponseEnvelope {
  bytes response = 1;
}

// The port peers reach this node on. Ports travel as uint32 because proto3 has no 16-bit type.
// The service rejects values outside 1024..=65535.
message AddressInUse {}
message AccessDenied {}

message ListenFailureProto {
  oneof failure {
    AddressInUse address_in_use = 1;
    AccessDenied access_denied = 2;
    string other = 3;
  }
}

message ListeningOnConfiguredPort {
  uint32 port = 1;
}

// `configured` is the port stored for the user. It could not be bound, so peers reach the node on
// `active` until it can.
message ListeningOnTemporaryPort {
  uint32 configured = 1;
  ListenFailureProto failure = 2;
  uint32 active = 3;
}

// Absent `configured` means no port could be picked at all.
message NotListening {
  optional uint32 configured = 1;
  ListenFailureProto failure = 2;
}

message ListenStatusProto {
  oneof status {
    ListeningOnConfiguredPort listening = 1;
    ListeningOnTemporaryPort temporary = 2;
    NotListening not_listening = 3;
  }
}

message GetListenStatusRequest {}

message ListenStarting {}

message GetListenStatusResponse {
  oneof state {
    ListenStarting starting = 1;
    ListenStatusProto status = 2;
  }
}

message SetListenPortRequest {
  uint32 port = 1;
}

message SetListenPortResponse {}

// Define a service for the server
service FileRequestService {
  // Add WaitForReady RPC at the beginning of the service methods
  rpc WaitForReady (WaitForReadyRequest) returns (WaitForReadyResponse);
  
  // Replace GetJoinSelfContactAuthorizationChallenge with:
  rpc GetFullSelfContact (GetFullSelfContactRequest) returns (GetFullSelfContactResponse);
  rpc UpdateIdentity( UpdateIdentityRequest) returns (UpdateIdentityResponse);
  rpc SharePublicSelfContact (SharePublicSelfContactRequest) returns (SharePublicSelfContactResponse);
  rpc RegisterContact (RegisterContactRequest) returns (RegisterContactResponse);
  rpc DecodeSignedContact (DecodeSignedContactRequest) returns (DecodeSignedContactResponse);
  
  // Add new methods at the beginning
  rpc GetContactName (GetContactNameRequest) returns (GetContactNameResponse);
  rpc GetContactNames (GetContactNamesRequest) returns (GetContactNamesResponse);
  
  // Add version RPC as first method
  rpc GetVersion (GetVersionRequest) returns (GetVersionResponse);
  rpc Shutdown (ShutdownRequest) returns (ShutdownResponse);
  rpc GetFileRequest (FileRequestRequest) returns (FileRequestResponse);
  rpc CreateFileRequest (CreateFileRequestRequest) returns (CreateFileRequestResponse);
  rpc UpdateFileRequest (UpdateFileRequestRequest) returns (UpdateFileRequestResponse);
  rpc DeleteFileRequest (DeleteFileRequestRequest) returns (DeleteFileRequestResponse);
  rpc GetAllFileRequests (GetAllFileRequestsRequest) returns (GetAllFileRequestsResponse);

  // Contact management
  rpc GetContact (GetContactRequest) returns (GetContactResponse);
  rpc GetAllContacts (GetAllContactsRequest) returns (GetAllContactsResponse);
  rpc UpdateContact (UpdateContactRequest) returns (UpdateContactResponse);
  rpc DeleteContact (DeleteContactRequest) returns (DeleteContactResponse);

  rpc UpdateSelfContactName (UpdateSelfContactNameRequest) returns (UpdateSelfContactNameResponse);
  rpc GetSelfContactDisplay(GetSelfContactDisplayRequest) returns (GetSelfContactDisplayResponse);

  // Node information
  rpc GetNodePeerId (GetNodePeerIdRequest) returns (GetNodePeerIdResponse);

  // Remote file request operations
  rpc StoreRemoteFileRequest (StoreRemoteFileRequestRequest) returns (StoreRemoteFileRequestResponse);
  rpc UpdateRemoteFileRequest (UpdateRemoteFileRequestRequest) returns (UpdateRemoteFileRequestResponse);
  rpc GetRemoteFileRequest (GetRemoteFileRequestRequest) returns (GetRemoteFileRequestResponse);
  rpc ListRemoteFileRequests (ListRemoteFileRequestsRequest) returns (ListRemoteFileRequestsResponse); 
  rpc GetAllRemoteFileRequests (GetAllRemoteFileRequestsRequest) returns (GetAllRemoteFileRequestsResponse);
  rpc DeleteRemoteFileRequest (DeleteRemoteFileRequestRequest) returns (DeleteRemoteFileRequestResponse);

  // Pending file operations
  rpc StorePendingFile (StorePendingFileRequest) returns (StorePendingFileResponse);
  rpc GetPendingFile (GetPendingFileRequest) returns (GetPendingFileResponse);
  rpc ListPendingFiles (ListPendingFilesRequest) returns (ListPendingFilesResponse);
  rpc GetAllPendingFiles (GetAllPendingFilesRequest) returns (GetAllPendingFilesResponse);
  rpc DeletePendingFile (DeletePendingFileRequest) returns (DeletePendingFileResponse);

  rpc ListReceivedFiles (ListReceivedFilesRequest) returns (ListReceivedFilesResponse);

  rpc DeleteReceivedFile (DeleteReceivedFileRequest) returns (DeleteReceivedFileResponse);

  // Resolve a filerequest's on-disk folder (relative to the host drop dir) for
  // opening files and filerequest folders from the UI.
  rpc ResolveFilerequestLocation (ResolveFilerequestLocationRequest) returns (ResolveFilerequestLocationResponse);

  rpc GetSelfContactInviteChallenge (GetSelfContactInviteChallengeRequest) returns (GetSelfContactInviteChallengeResponse);
  rpc UnregisterSelfContactInviteChallenge (UnregisterSelfContactInviteChallengeRequest) returns (UnregisterSelfContactInviteChallengeResponse);
  rpc UseSelfContactInvite (UseSelfContactInviteRequest) returns (UseSelfContactInviteResponse);

  rpc GetContactShareChallenge (GetContactShareChallengeRequest) returns (GetContactShareChallengeResponse);
  rpc UnregisterContactShareChallenge (UnregisterContactShareChallengeRequest) returns (UnregisterContactShareChallengeResponse);
  rpc UseContactShareChallenge (UseContactShareChallengeRequest) returns (UseContactShareChallengeResponse);

  rpc BackupData (BackupDataRequest) returns (BackupDataResponse);
  rpc RestoreData (RestoreDataRequest) returns (RestoreDataResponse);
  rpc GetBackupPasswordStatus (GetBackupPasswordStatusRequest) returns (GetBackupPasswordStatusResponse);
  rpc EvaluateBackupPassword (EvaluateBackupPasswordRequest) returns (EvaluateBackupPasswordResponse);
  rpc SetBackupPassword (SetBackupPasswordRequest) returns (SetBackupPasswordResponse);
  // Counts toward the re-verification schedule only while a verification is due.
  rpc VerifyBackupPassword (VerifyBackupPasswordRequest) returns (VerifyBackupPasswordResponse);
  rpc SnoozeBackupPasswordVerification (SnoozeBackupPasswordVerificationRequest) returns (SnoozeBackupPasswordVerificationResponse);

  // Owned devices (this user's other devices)
  rpc ListOwnedDevices (ListOwnedDevicesRequest) returns (ListOwnedDevicesResponse);
  // Renames *this* device only; other devices are renamed on the device itself and synced.
  rpc RenameThisDevice (RenameThisDeviceRequest) returns (RenameThisDeviceResponse);
  rpc RemoveOwnedDevice (RemoveOwnedDeviceRequest) returns (RemoveOwnedDeviceResponse);

  // Opaque settings
  rpc GetSettings (GetSettingsRequest) returns (SettingsResponseEnvelope);
  rpc MutateSettings (SettingsRequestEnvelope) returns (SettingsResponseEnvelope);

  rpc GetListenStatus (GetListenStatusRequest) returns (GetListenStatusResponse);
  rpc SetListenPort (SetListenPortRequest) returns (SetListenPortResponse);

  rpc GetEntitlementStatus (GetEntitlementStatusRequest) returns (GetEntitlementStatusResponse);
  rpc GetLicenseIdentity (GetLicenseIdentityRequest) returns (GetLicenseIdentityResponse);
  rpc PrepareLicenseCheck (PrepareLicenseCheckRequest) returns (PrepareLicenseCheckResponse);
  rpc SubmitLicenseCheckResponse (SubmitLicenseCheckResponseRequest) returns (LicenseCheckAck);

  rpc Stream (stream ClientMessage) returns (stream ServerMessage);
}

message EntitlementProto {
  string id = 1;
  // Unix seconds; unset means the entitlement never expires.
  optional uint64 expires_at = 2;
}

message GetEntitlementStatusRequest {}

message GetEntitlementStatusResponse {
  repeated EntitlementProto entitlements = 1;
  // True while pro is granted only by fail-open (license server unreachable and no
  // verified certificate for the current identity).
  bool provisional = 2;
}

message GetLicenseIdentityRequest {}

message GetLicenseIdentityResponse {
  string identity = 1;
}

message LicenseHttpRequest {
  bytes body = 1;
}

message PrepareLicenseCheckRequest {
  bool force = 1;
}

message LicenseCheckNotDue {}

message PrepareLicenseCheckResponse {
  oneof outcome {
    LicenseHttpRequest request = 1;
    LicenseCheckNotDue not_due = 2;
  }
}

message SubmitLicenseCheckResponseRequest {
  uint32 http_status = 1;
  bytes body = 2;
}

message LicenseCheckAck {}

message OwnedDeviceProto {
  string peer_id = 1;
  // Empty until the device is named, and never again after, since a name is never set to empty.
  // Not optional, because being unnamed only exists before setup and every reader would
  // otherwise carry that case for good.
  string name = 2;
}

message ListOwnedDevicesRequest {
  // empty
}

message ListOwnedDevicesResponse {
  repeated OwnedDeviceProto devices = 1;
}

message RenameThisDeviceRequest {
  // Rejected as INVALID_ARGUMENT when empty or whitespace only.
  string name = 1;
}

message RenameThisDeviceResponse {
  bool success = 1;
}

message RemoveOwnedDeviceRequest {
  string peer_id = 1;
}

message RemoveOwnedDeviceResponse {
  bool success = 1;
}

message BackupDataRequest {}

// Failures arrive as a gRPC status.
message BackupDataResponse {
  oneof outcome {
    BackupWritten written = 1;
    BackupPasswordNotSet password_not_set = 2;
  }
}

message BackupWritten {}
message BackupPasswordNotSet {}

message RestoreDataRequest {
  string backup_file_path = 1;
  optional string password = 2;
}

// Failures arrive as a gRPC status.
message RestoreDataResponse {
  oneof outcome {
    RestoredEncrypted restored = 1;
    // Deprecated format: an unencrypted backup from before passwords existed.
    RestoredLegacyPlain restored_legacy_plain = 2;
    BackupNotABackup not_a_backup = 3;
    BackupUnsupported unsupported = 4;
    BackupPasswordRequired password_required = 5;
    BackupWrongPassword wrong_password = 6;
    BackupCorrupt corrupt = 7;
  }
}

message RestoredEncrypted {}
message RestoredLegacyPlain {}
message BackupNotABackup {}
message BackupUnsupported {}
message BackupPasswordRequired {}
message BackupWrongPassword {}
message BackupCorrupt {}

message GetBackupPasswordStatusRequest {}

message GetBackupPasswordStatusResponse {
  oneof status {
    BackupPasswordNotSet missing = 1;
    BackupPasswordSet present = 2;
  }
}

message BackupPasswordSet {
  bool verification_due = 1;
}

message EvaluateBackupPasswordRequest {
  string password = 1;
}

// Never calls a password safe. The estimate has no word lists, so it only errs towards more
// guesses (ADR-0012). Warnings and suggestions are zxcvbn's.
message EvaluateBackupPasswordResponse {
  oneof check {
    PasswordTooShort too_short = 1;
    PasswordGuessable guessable = 2;
    PasswordNoWeaknessFound no_weakness_found = 3;
  }
}

message PasswordTooShort {}

message PasswordGuessable {
  optional PasswordWarning warning = 1;
  repeated PasswordSuggestion suggestions = 2;
}

message PasswordNoWeaknessFound {}

enum PasswordWarning {
  PASSWORD_WARNING_UNSPECIFIED = 0;
  PASSWORD_WARNING_STRAIGHT_ROWS_OF_KEYS = 1;
  PASSWORD_WARNING_SHORT_KEYBOARD_PATTERNS = 2;
  PASSWORD_WARNING_REPEATED_CHARACTERS = 3;
  PASSWORD_WARNING_REPEATED_BLOCKS = 4;
  PASSWORD_WARNING_SEQUENCES = 5;
  PASSWORD_WARNING_RECENT_YEARS = 6;
  PASSWORD_WARNING_DATES = 7;
}

enum PasswordSuggestion {
  PASSWORD_SUGGESTION_UNSPECIFIED = 0;
  PASSWORD_SUGGESTION_USE_A_FEW_WORDS = 1;
  PASSWORD_SUGGESTION_NO_NEED_FOR_SYMBOLS = 2;
  PASSWORD_SUGGESTION_ADD_ANOTHER_WORD = 3;
  PASSWORD_SUGGESTION_LONGER_KEYBOARD_PATTERN = 4;
  PASSWORD_SUGGESTION_AVOID_REPEATS = 5;
  PASSWORD_SUGGESTION_AVOID_SEQUENCES = 6;
  PASSWORD_SUGGESTION_AVOID_RECENT_YEARS = 7;
  PASSWORD_SUGGESTION_AVOID_PERSONAL_YEARS = 8;
  PASSWORD_SUGGESTION_AVOID_PERSONAL_DATES = 9;
}

// A password shorter than six characters is refused with INVALID_ARGUMENT.
message SetBackupPasswordRequest {
  string password = 1;
}

message SetBackupPasswordResponse {}

message VerifyBackupPasswordRequest {
  string password = 1;
}

message VerifyBackupPasswordResponse {
  bool correct = 1;
}

message SnoozeBackupPasswordVerificationRequest {}

message SnoozeBackupPasswordVerificationResponse {}

message ClientMessage {
  oneof message {
    ClientHeartbeat heartbeat = 2;
  }
}

// Sent by an attached client on stream open, on every app-lifecycle transition, and periodically
// while attached. The service uses it to decide how eagerly the node should re-poke its peers: a
// client that stops beating decays to "absent" and the node drops to its background cadence, which
// is what makes a crashed or force-killed client indistinguishable from a cleanly closed one.
message ClientHeartbeat {
  // Whether a human is actually looking at the app right now. Derived by the client from its own
  // lifecycle state — the service cannot observe this and must not guess at it.
  bool foreground = 1;
}

message ServerMessage {
  oneof message {
    ReceivedSelfContactInviteOverNetwork received_self_contact_invite_over_network = 1;
    SelfContactInviteAcceptedOverNetwork self_contact_invite_accepted_over_network = 2;
    ReceivedContactShareOverNetwork received_contact_share_over_network = 3;
    DatabaseRestoredFromBackup database_restored_from_backup = 4;
    PendingFileStatusChanged pending_file_status_changed = 5;
    ReceivedFileStatusChanged received_file_status_changed = 6;
    // A sync with another device converged. The changed entities are not known, so these carry
    // the full new state for the concern and the client replaces its copy outright.
    ContactsChanged contacts_changed = 7;
    RemoteFilerequestsChanged remote_filerequests_changed = 8;
    OwnedDevicesChanged owned_devices_changed = 9;

    EntitlementsChanged entitlements_changed = 10;
    SelfContactChanged self_contact_changed = 12;
    SettingsChanged settings_changed = 13;
    ReceivedFilesChanged received_files_changed = 14;

    ContactUpserted contact_upserted = 15;
    ContactRemoved contact_removed = 16;
    FilerequestUpserted filerequest_upserted = 17;
    FilerequestRemoved filerequest_removed = 18;
    RemoteFilerequestUpserted remote_filerequest_upserted = 19;
    RemoteFilerequestRemoved remote_filerequest_removed = 20;
    PendingFilesAdded pending_files_added = 21;
    PendingFileRemoved pending_file_removed = 22;
    OwnedDeviceUpserted owned_device_upserted = 23;
    OwnedDeviceRemoved owned_device_removed = 24;
    ContactShareRejected contact_share_rejected = 25;
    ListenStatusChanged listen_status_changed = 26;
  }
}

message ContactShareRejected {}

message ContactUpserted {
  ContactProto contact = 1;
}

message ContactRemoved {
  string contact_id = 1;
}

message FilerequestUpserted {
  FileRequestProto file_request = 1;
}

message FilerequestRemoved {
  string id = 1;
}

message RemoteFilerequestUpserted {
  RemoteFileRequestProto remote_file_request = 1;
}

message RemoteFilerequestRemoved {
  string id = 1;
}

message PendingFilesAdded {
  repeated PendingFileProto pending_files = 1;
}

message PendingFileRemoved {
  string id = 1;
  string target_file_request_id = 2;
}

message OwnedDeviceUpserted {
  OwnedDeviceProto device = 1;
}

message OwnedDeviceRemoved {
  string peer_id = 1;
}

message SelfContactChanged {
  ContactProto self_contact = 1;
}

// A serialized `internet_settings.SettingsView` — the same bytes the Settings relay answers with.
message SettingsChanged {
  bytes view = 1;
}

// A signal rather than the files themselves. Received-file lists are per-filerequest and can be
// long, so the client refetches just the one that changed.
message ReceivedFilesChanged {
  string filerequest_id = 1;
}

message ListenStatusChanged {
  ListenStatusProto status = 1;
}

message EntitlementsChanged {
  repeated EntitlementProto entitlements = 1;
  bool provisional = 2;
}

message ReceivedSelfContactInviteOverNetwork {}
message SelfContactInviteAcceptedOverNetwork {}
message ReceivedContactShareOverNetwork {}
message DatabaseRestoredFromBackup {}

// The full contact list after a sync converged.
message ContactsChanged {
  repeated ContactProto contacts = 1;
}

// The full remote-filerequest list after a sync converged, plus every pending file (each tagged
// with its target_file_request_id) so the client can rebuild the nested structure. Pending files
// for a remote filerequest removed elsewhere are already gone.
message RemoteFilerequestsChanged {
  repeated RemoteFileRequestProto remote_file_requests = 1;
  repeated PendingFileProto pending_files = 2;
}

// The full owned-device list after a sync converged.
message OwnedDevicesChanged {
  repeated OwnedDeviceProto devices = 1;
}

message PendingFileStatusChanged {
  string pending_file_id = 1;
  SendStatusProto new_status = 2;
  optional uint64 progress_bytes = 3;
  optional string transfer_id = 4;
  optional uint64 file_size_bytes = 5;
  string target_file_request_id = 6;
  repeated string interruption_reasons = 7;
}

message ReceivedFileStatusChanged {
  optional string transfer_id = 1;
  string filerequest_id = 2;
  ReceiveStatusProto new_status = 3;
  uint64 progress_bytes = 4;
  uint64 file_size_bytes = 5;
  string file_name = 6;
  // The name the file is actually stored under on disk (after sanitization/
  // deduplication). This is what the UI should display.
  string persisted_as_name = 7;
}

message GetSelfContactInviteChallengeRequest {
  // Empty because the challenge is generated server-side
} 

message GetSelfContactInviteChallengeResponse {
  bytes challenge = 1;
}

message UnregisterSelfContactInviteChallengeRequest {
  bytes challenge = 1;
}

message UnregisterSelfContactInviteChallengeResponse {
  // Empty response
}

message GetContactShareChallengeRequest {
  // Empty because the challenge is generated server-side
}

message GetContactShareChallengeResponse {
  bytes challenge = 1;
}

message UnregisterContactShareChallengeRequest {
  bytes challenge = 1;
}

message UnregisterContactShareChallengeResponse {
  // Empty response
}

message UseContactShareChallengeRequest {
  bytes challenge = 1;
  string peer_id = 2;
}

message UseContactShareChallengeResponse {
  // empty
}

message UseSelfContactInviteRequest {
  bytes challenge = 1;
  string peer_id = 2;
}

message UseSelfContactInviteResponse {
  // empty
}

message FileRequestRequest {
  string id = 1;
}

message FileRequestResponse {
  FileRequestProto file_request = 1;
}

message GetAllFileRequestsRequest {
  // This message can be empty
}

message GetAllFileRequestsResponse {
  repeated FileRequestProto file_requests = 1;
}

message CreateFileRequestRequest {
